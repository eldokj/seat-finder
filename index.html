<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Find My Seat</title>

  <!-- Supabase JavaScript Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8fbff);
      color: #172033;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin: 20px 0 25px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 18px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
    }

    .header p {
      margin: 8px 0 0;
      color: #667085;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(16, 24, 40, 0.10);
      border: 1px solid #e4e7ec;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      background: white;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
    }

    .error {
      background: #fef3f2;
      color: #b42318;
      border: 1px solid #fecdca;
    }

    .success {
      background: #ecfdf3;
      color: #027a48;
      border: 1px solid #abefc6;
    }

    .result {
      display: none;
      margin-top: 22px;
    }

    .result-title {
      text-align: center;
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .student-name {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .register {
      text-align: center;
      color: #667085;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .seat-box {
      background: linear-gradient(135deg, #eff6ff, #f8fbff);
      border: 2px solid #2563eb;
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      margin-bottom: 18px;
    }

    .hall {
      font-size: 30px;
      font-weight: 900;
      color: #1d4ed8;
      margin-bottom: 8px;
    }

    .seat-number {
      font-size: 20px;
      font-weight: 800;
      color: #344054;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .detail {
      background: #f9fafb;
      border: 1px solid #eaecf0;
      border-radius: 10px;
      padding: 13px;
    }

    .detail-label {
      font-size: 11px;
      color: #667085;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 15px;
      font-weight: 700;
      word-break: break-word;
    }

    .footer {
      text-align: center;
      color: #98a2b3;
      font-size: 12px;
      margin-top: 20px;
      line-height: 1.5;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 15px;
      color: #667085;
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #d0d5dd;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 18px;
        border-radius: 16px;
      }

      .header h1 {
        font-size: 27px;
      }

      .hall {
        font-size: 26px;
      }

      .details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <div class="logo">
        S
      </div>

      <h1>FIND MY SEAT</h1>

      <p>Exam Seat Allotment System</p>

    </div>

    <div class="card">

      <!-- Exam Date -->
      <div class="field">

        <label for="examDate">
          Exam Date
        </label>

        <select id="examDate">
          <option value="">
            Loading dates...
          </option>
        </select>

      </div>


      <!-- Session -->
      <div class="field">

        <label for="session">
          Session
        </label>

        <select id="session">
          <option value="">
            Select session
          </option>
        </select>

      </div>


      <!-- Register Number -->
      <div class="field">

        <label for="registerNo">
          Register Number
        </label>

        <input
          type="text"
          id="registerNo"
          placeholder="Enter your register number"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
        >

      </div>


      <!-- Search Button -->
      <button
        id="findButton"
        onclick="findSeat()"
      >
        FIND MY SEAT
      </button>


      <!-- Loading -->
      <div
        id="loading"
        class="loading"
      >
        <span class="spinner"></span>
        Searching for your seat...
      </div>


      <!-- Message -->
      <div
        id="message"
        class="message"
      ></div>


      <!-- Result -->
      <div
        id="result"
        class="result"
      >

        <div class="result-title">
          YOUR EXAM SEAT
        </div>


        <div
          id="studentName"
          class="student-name"
        ></div>


        <div
          id="registerDisplay"
          class="register"
        ></div>


        <!-- Main Seat -->
        <div class="seat-box">

          <div
            id="hall"
            class="hall"
          ></div>

          <div
            id="seatNumber"
            class="seat-number"
          ></div>

        </div>


        <!-- Details -->
        <div class="details">

          <div class="detail">

            <div class="detail-label">
              Programme
            </div>

            <div
              id="programme"
              class="detail-value"
            ></div>

          </div>


          <div class="detail">

            <div class="detail-label">
              Exam Date
            </div>

            <div
              id="dateDisplay"
              class="detail-value"
            ></div>

          </div>


          <div class="detail">

            <div class="detail-label">
              Session
            </div>

            <div
              id="sessionDisplay"
              class="detail-value"
            ></div>

          </div>


          <div class="detail">

            <div class="detail-label">
              Row
            </div>

            <div
              id="row"
              class="detail-value"
            ></div>

          </div>


          <div class="detail">

            <div class="detail-label">
              Column
            </div>

            <div
              id="column"
              class="detail-value"
            ></div>

          </div>


          <div class="detail">

            <div class="detail-label">
              Seat Number
            </div>

            <div
              id="seatDisplay"
              class="detail-value"
            ></div>

          </div>

        </div>

      </div>

    </div>


    <div class="footer">

      Exam Seat Allotment<br>

      Please verify your details before entering the examination hall.

    </div>

  </div>


  <script>

    // ============================================================
    // SUPABASE CONFIGURATION
    // ============================================================

    const SUPABASE_URL =
      "https://gsypaiqcxqecvscyohkw.supabase.co";

    /*
      IMPORTANT:
      Replace the value below with your Supabase
      PUBLISHABLE KEY beginning with:

      sb_publishable_...

      DO NOT use the sb_secret_ key.
    */

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_o6UH59qlBBk6LmEpw-gn-w_b5PBKD4i";


    // Create Supabase client
    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // ============================================================
    // PAGE ELEMENTS
    // ============================================================

    const examDate =
      document.getElementById("examDate");

    const session =
      document.getElementById("session");

    const registerNo =
      document.getElementById("registerNo");

    const findButton =
      document.getElementById("findButton");

    const loading =
      document.getElementById("loading");

    const message =
      document.getElementById("message");

    const result =
      document.getElementById("result");


    // ============================================================
    // INITIALIZE
    // ============================================================

    window.addEventListener(
      "DOMContentLoaded",
      async function () {

        await loadExamDates();

      }
    );


    // ============================================================
    // LOAD EXAM DATES
    // ============================================================

    async function loadExamDates() {

      examDate.innerHTML =
        '<option value="">Loading dates...</option>';


      const {
        data,
        error
      } = await supabaseClient

        .from("seat_allocations")

        .select("exam_date")

        .eq(
          "status",
          "Allotted"
        )

        .order(
          "exam_date",
          {
            ascending: true
          }
        );


      if (error) {

        console.error(
          "Date loading error:",
          error
        );

        examDate.innerHTML =
          '<option value="">Unable to load dates</option>';

        showMessage(
          "Unable to connect to the seat database.",
          "error"
        );

        return;
      }


      const uniqueDates =
        [
          ...new Set(
            data.map(
              item => item.exam_date
            )
          )
        ];


      examDate.innerHTML =
        '<option value="">Select exam date</option>';


      uniqueDates.forEach(
        function (date) {

          const option =
            document.createElement("option");

          option.value = date;

          option.textContent =
            formatDate(date);

          examDate.appendChild(option);

        }
      );


      /*
        If only one exam date exists,
        automatically select it.
      */

      if (
        uniqueDates.length === 1
      ) {

        examDate.value =
          uniqueDates[0];

        await loadSessions();

      }

    }


    // ============================================================
    // DATE CHANGE
    // ============================================================

    examDate.addEventListener(
      "change",
      async function () {

        await loadSessions();

      }
    );


    // ============================================================
    // LOAD SESSIONS
    // ============================================================

    async function loadSessions() {

      const selectedDate =
        examDate.value;


      session.innerHTML =
        '<option value="">Loading sessions...</option>';


      if (!selectedDate) {

        session.innerHTML =
          '<option value="">Select session</option>';

        return;

      }


      const {
        data,
        error
      } = await supabaseClient

        .from("seat_allocations")

        .select("session")

        .eq(
          "exam_date",
          selectedDate
        )

        .eq(
          "status",
          "Allotted"
        );


      if (error) {

        console.error(
          "Session loading error:",
          error
        );

        session.innerHTML =
          '<option value="">Unable to load sessions</option>';

        return;

      }


      const uniqueSessions =
        [
          ...new Set(
            data.map(
              item => item.session
            )
          )
        ];


      session.innerHTML =
        '<option value="">Select session</option>';


      uniqueSessions.forEach(
        function (value) {

          const option =
            document.createElement("option");

          option.value = value;


          if (value === "FN") {

            option.textContent =
              "FN - Forenoon";

          } else if (
            value === "AN"
          ) {

            option.textContent =
              "AN - Afternoon";

          } else {

            option.textContent =
              value;

          }


          session.appendChild(
            option
          );

        }
      );


      /*
        Automatically select session
        if only one exists.
      */

      if (
        uniqueSessions.length === 1
      ) {

        session.value =
          uniqueSessions[0];

      }

    }


    // ============================================================
    // FIND SEAT
    // ============================================================

    async function findSeat() {

      hideMessage();

      result.style.display =
        "none";


      const date =
        examDate.value;


      const selectedSession =
        session.value;


      const regNo =
        registerNo.value
          .trim()
          .toUpperCase();


      // Validate date

      if (!date) {

        showMessage(
          "Please select the exam date.",
          "error"
        );

        return;

      }


      // Validate session

      if (!selectedSession) {

        showMessage(
          "Please select the session.",
          "error"
        );

        return;

      }


      // Validate register number

      if (!regNo) {

        showMessage(
          "Please enter your register number.",
          "error"
        );

        registerNo.focus();

        return;

      }


      // Start loading

      findButton.disabled =
        true;

      loading.style.display =
        "block";


      try {

        const {
          data,
          error
        } = await supabaseClient

          .from("seat_allocations")

          .select(
            "register_no, student_name, programme, exam_date, session, hall, row_no, column_no, seat_no"
          )

          .eq(
            "register_no",
            regNo
          )

          .eq(
            "exam_date",
            date
          )

          .eq(
            "session",
            selectedSession
          )

          .eq(
            "status",
            "Allotted"
          )

          .limit(1);


        if (error) {

          console.error(
            "Seat search error:",
            error
          );

          showMessage(
            "Unable to search the seat database. Please try again.",
            "error"
          );

          return;

        }


        if (
          !data ||
          data.length === 0
        ) {

          showMessage(
            "No seat allotment found for this register number, date and session.",
            "error"
          );

          return;

        }


        displaySeat(
          data[0]
        );

      } catch (error) {

        console.error(
          "Unexpected error:",
          error
        );

        showMessage(
          "Something went wrong. Please try again.",
          "error"
        );

      } finally {

        findButton.disabled =
          false;

        loading.style.display =
          "none";

      }

    }


    // ============================================================
    // DISPLAY SEAT
    // ============================================================

    function displaySeat(
      student
    ) {

      document.getElementById(
        "studentName"
      ).textContent =
        student.student_name ||
        "-";


      document.getElementById(
        "registerDisplay"
      ).textContent =
        "Register No: " +
        student.register_no;


      document.getElementById(
        "programme"
      ).textContent =
        student.programme ||
        "-";


      document.getElementById(
        "hall"
      ).textContent =
        student.hall ||
        "-";


      document.getElementById(
        "row"
      ).textContent =
        student.row_no ??
        "-";


      document.getElementById(
        "column"
      ).textContent =
        student.column_no ??
        "-";


      document.getElementById(
        "seatNumber"
      ).textContent =
        "Seat " +
        (
          student.seat_no ||
          "-"
        );


      document.getElementById(
        "seatDisplay"
      ).textContent =
        student.seat_no ||
        "-";


      document.getElementById(
        "dateDisplay"
      ).textContent =
        formatDate(
          student.exam_date
        );


      document.getElementById(
        "sessionDisplay"
      ).textContent =
        formatSession(
          student.session
        );


      result.style.display =
        "block";


      result.scrollIntoView(
        {
          behavior: "smooth",
          block: "start"
        }
      );

    }


    // ============================================================
    // FORMAT DATE
    // ============================================================

    function formatDate(
      dateString
    ) {

      if (!dateString) {

        return "-";

      }


      const parts =
        dateString.split("-");


      if (
        parts.length !== 3
      ) {

        return dateString;

      }


      const year =
        Number(parts[0]);


      const month =
        Number(parts[1]);


      const day =
        Number(parts[2]);


      const date =
        new Date(
          year,
          month - 1,
          day
        );


      return date.toLocaleDateString(
        "en-IN",
        {
          day: "2-digit",
          month: "short",
          year: "numeric"
        }
      );

    }


    // ============================================================
    // FORMAT SESSION
    // ============================================================

    function formatSession(
      value
    ) {

      if (value === "FN") {

        return "FN - Forenoon";

      }


      if (value === "AN") {

        return "AN - Afternoon";

      }


      return value || "-";

    }


    // ============================================================
    // SHOW MESSAGE
    // ============================================================

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        "message " +
        type;

      message.style.display =
        "block";

    }


    // ============================================================
    // HIDE MESSAGE
    // ============================================================

    function hideMessage() {

      message.style.display =
        "none";

    }


    // ============================================================
    // ENTER KEY SEARCH
    // ============================================================

    registerNo.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter"
        ) {

          findSeat();

        }

      }
    );

  </script>

</body>
</html>
